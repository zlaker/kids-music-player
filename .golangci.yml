version: "2"

run:
  timeout: 5m

linters:
  enable:
    - govet
    - staticcheck
    - unused
    - errcheck
    - errorlint
    - ineffassign
    - durationcheck
    - gosec
  settings:
    errcheck:
      check-type-assertions: true
    gosec:
      # G404 flags math/rand. Track order is not a secret.
      excludes:
        - G404
  exclusions:
    paths:
      - vendor$
