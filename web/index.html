<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Детский плеер</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div x-data="playerApp()" x-init="init()" x-cloak>
    <button x-show="needsUnlock" @click="unlock()" class="unlock">
      Нажмите, чтобы включить звук
    </button>
    <header class="topbar">
      <div class="topbar-inner">
        <button @click="open('')" class="brand">Музыка</button>
        <button @click="panel = 'timer'" class="bar-btn">
          <span x-show="!sleepLeft">Таймер</span>
          <span x-show="sleepLeft" x-text="'Таймер ' + sleepLeft"></span>
        </button>
        <button @click="openHistory()" class="bar-btn">История</button>
        <button @click="toggleRandom()" class="bar-btn" :class="player.random ? 'on' : ''">Случайно</button>
        <button @click="openPlaylists()" class="bar-btn">Плейлисты</button>
      </div>
    </header>

    <main class="wrap">
      <nav class="crumbs">
        <button @click="open('')" class="peach-text">Все альбомы</button>
        <template x-for="crumb in crumbs" :key="crumb.path">
          <span class="row">
            <span class="sep">/</span>
            <button @click="open(crumb.path)" x-text="crumb.name"></button>
          </span>
        </template>
      </nav>

      <div x-show="notice" class="notice" x-text="notice"></div>
      <div x-show="loading" class="muted">Загрузка…</div>
      <div x-show="!loading && folders.length === 0 && tracks.length === 0" class="muted">В этой папке нет mp3.</div>

      <section x-show="folders.length">
        <div class="album-grid">
          <template x-for="item in folders" :key="item.path">
            <button @click="open(item.path)" class="album">
              <div class="cover-lg">
                <img x-show="item.hasCover" :src="coverUrl(item.path)" :alt="item.name">
                <div x-show="!item.hasCover" class="ph">📁</div>
              </div>
              <div x-text="item.name"></div>
            </button>
          </template>
        </div>
      </section>

      <section x-show="tracks.length">
        <div class="track-head">
          <h2>Треки</h2>
          <div class="row">
            <button @click="playFolder()" class="bar-btn peach">Играть папку</button>
            <button @click="createPlaylistFromFolder()" class="bar-btn">В плейлист</button>
          </div>
        </div>
        <input
          type="search"
          x-model="query"
          @keydown.enter.prevent="playFirstMatch()"
          placeholder="Найти трек в этой папке"
          class="search"
        >
        <p x-show="query.trim() && visibleTracks.length === 0" class="muted">Ничего не найдено</p>
        <div class="track-list">
          <template x-for="item in visibleTracks" :key="item.path">
            <div class="track" :class="(player.track && player.track.path === item.path ? 'current ' : '') + (item.played ? 'played' : '')">
              <button @click="playTrack(item.path)" class="track-play">
                <div class="cover">
                  <img x-show="item.hasCover" :src="coverUrl(item.path)" alt="">
                  <div x-show="!item.hasCover" class="ph">🎵</div>
                </div>
                <div class="titles">
                  <div class="title" x-text="item.title || item.name"></div>
                  <div class="sub" x-text="[item.artist, item.album].filter(Boolean).join(' · ')"></div>
                </div>
              </button>
              <button @click="startAddTracks([item.path])" class="icon-btn">+</button>
            </div>
          </template>
        </div>
      </section>
    </main>

    <div x-show="panel" class="panel-back" @click.self="closePanel()">
      <div class="panel">
        <div class="panel-head">
          <h2 x-text="panelTitle"></h2>
          <button @click="closePanel()" class="icon-btn">✕</button>
        </div>

        <template x-if="panel === 'timer'">
          <div class="stack">
            <template x-for="m in [15, 20, 30, 45, 60]" :key="m">
              <button @click="setTimer(m)" class="wide" x-text="m + ' минут'"></button>
            </template>
            <button @click="setTimer(0)" class="wide peach">Выключить таймер</button>
          </div>
        </template>

        <template x-if="panel === 'history'">
          <div>
            <div class="row" style="margin-bottom: 1rem">
              <button x-show="!confirmClear" @click="confirmClear = true" class="wide">Очистить историю</button>
              <button x-show="confirmClear" @click="clearHistory()" class="wide peach">Точно очистить</button>
              <button x-show="confirmClear" @click="confirmClear = false" class="wide">Отмена</button>
            </div>
            <div x-show="history.length === 0" class="muted">Пока пусто</div>
            <div class="stack">
              <template x-for="item in history" :key="item.playedAt + item.path">
                <button @click="playTrack(item.path); closePanel()" class="history-item">
                  <div x-text="item.title || item.path"></div>
                  <div class="sub" x-text="item.artist"></div>
                </button>
              </template>
            </div>
          </div>
        </template>

        <template x-if="panel === 'playlists'">
          <div>
            <form @submit.prevent="createPlaylist()" class="form-row">
              <input x-model="playlistName" placeholder="Новый плейлист">
              <button class="bar-btn peach">Создать</button>
            </form>
            <p x-show="addTrackPaths.length" class="muted">Выберите плейлист</p>
            <div x-show="playlists.length === 0" class="muted">Плейлистов нет</div>
            <div class="stack">
              <template x-for="pl in playlists" :key="pl.id">
                <div class="playlist">
                  <div x-text="pl.name"></div>
                  <div class="sub" x-text="(pl.tracks ? pl.tracks.length : 0) + ' треков'"></div>
                  <div class="row">
                    <button x-show="addTrackPaths.length" @click="addToPlaylist(pl)" class="bar-btn peach">Добавить</button>
                    <button x-show="!addTrackPaths.length" @click="openPlaylist(pl.id)" class="bar-btn">Открыть</button>
                    <button x-show="!addTrackPaths.length" @click="playPlaylist(pl.id); closePanel()" class="bar-btn peach">Играть</button>
                    <button x-show="confirmDeleteId !== pl.id" @click="confirmDeleteId = pl.id" class="bar-btn">Удалить</button>
                    <button x-show="confirmDeleteId === pl.id" @click="deletePlaylist(pl.id)" class="bar-btn peach">Точно удалить</button>
                    <button x-show="confirmDeleteId === pl.id" @click="confirmDeleteId = ''" class="bar-btn">Отмена</button>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>

        <template x-if="panel === 'playlist' && currentPlaylist">
          <div>
            <button @click="openPlaylists()" class="wide">← К плейлистам</button>
            <div class="row" style="margin: 1rem 0">
              <button
                x-show="currentPlaylist.tracks && currentPlaylist.tracks.length"
                @click="playPlaylist(currentPlaylist.id); closePanel()"
                class="bar-btn peach"
              >Играть</button>
              <button x-show="confirmDeleteId !== currentPlaylist.id" @click="confirmDeleteId = currentPlaylist.id" class="bar-btn">Удалить</button>
              <button x-show="confirmDeleteId === currentPlaylist.id" @click="deletePlaylist(currentPlaylist.id)" class="bar-btn peach">Точно удалить</button>
              <button x-show="confirmDeleteId === currentPlaylist.id" @click="confirmDeleteId = ''" class="bar-btn">Отмена</button>
            </div>
            <div x-show="!currentPlaylist.tracks || currentPlaylist.tracks.length === 0" class="muted">
              Пока нет треков. Нажмите + у песни.
            </div>
            <div class="track-list">
              <template x-for="item in (currentPlaylist.tracks || [])" :key="item.path">
                <div class="track" :class="(player.track && player.track.path === item.path ? 'current ' : '') + (item.played ? 'played' : '')">
                  <button @click="playPlaylist(currentPlaylist.id, item.path); closePanel()" class="track-play">
                    <div class="cover">
                      <img x-show="item.hasCover" :src="coverUrl(item.path)" alt="">
                      <div x-show="!item.hasCover" class="ph">🎵</div>
                    </div>
                    <div class="titles">
                      <div class="title" x-text="item.title || item.name || item.path"></div>
                      <div class="sub" x-text="[item.artist, item.album].filter(Boolean).join(' · ')"></div>
                    </div>
                  </button>
                  <button @click="removeFromPlaylist(item.path)" class="icon-btn">−</button>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </div>

    <footer class="player-bar">
      <div class="player-inner">
        <div class="player-main">
          <div class="cover">
            <img x-show="player.track && !coverBroken" :src="player.track ? coverUrl(player.track.path) : ''" alt="" @error="coverBroken = true">
            <div x-show="!player.track || coverBroken" class="ph">🎵</div>
          </div>
          <div class="titles">
            <div class="title" x-text="player.track ? player.track.title : 'Ничего не играет'"></div>
            <div class="sub" x-text="player.track ? [player.track.artist, player.track.album].filter(Boolean).join(' · ') : 'Выберите трек'"></div>
          </div>
          <div class="transport">
            <button @click="prev()">⏮</button>
            <button @click="toggle()" class="peach" x-text="player.playing ? '⏸' : '▶'"></button>
            <button @click="next()">⏭</button>
          </div>
        </div>
        <div class="seek-row">
          <span class="time" x-text="fmt(localPosition)"></span>
          <input type="range" min="0" :max="duration || 0" step="0.1" :value="localPosition" @input="seek($event.target.value)">
          <span class="time end" x-text="fmt(duration)"></span>
        </div>
        <div class="volume-row">
          <span class="vol-label">Громкость</span>
          <input type="range" min="0" max="1" step="0.05" :value="volume" @input="setVolume($event.target.value)">
        </div>
      </div>
    </footer>

    <audio x-ref="audio" preload="metadata" playsinline webkit-playsinline @timeupdate="onTime()" @ended="onEnded()" @error="onAudioError()" @loadedmetadata="duration = $refs.audio.duration || 0"></audio>
  </div>
  <script defer src="/alpine.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
